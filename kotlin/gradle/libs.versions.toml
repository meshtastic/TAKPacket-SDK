[versions]
kotlin = "2.4.10"
protobufs = "2.7.26"
xmlutil = "1.0.1"
kzstd = "0.1.0"
dokka = "2.2.0"
binary-compat = "0.18.1"
kover = "0.9.9"
vanniktech-publish = "0.37.0"
junit-jupiter = "6.1.2"
junit-platform = "6.1.2"
spotless = "8.8.0"
ktlint = "1.8.0"
detekt = "1.23.8"

[libraries]
protobufs = { module = "org.meshtastic:protobufs", version.ref = "protobufs" }
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }
# kzstd: the pure-Kotlin multiplatform zstd codec, extracted from this SDK's
# former internal.zstd package into a standalone library so the engine lives and
# is tested in exactly one place. `implementation` (not compileOnly) because
# Native/JS/Wasm cannot link a compileOnly dep, so it ships transitively in the
# published POM/metadata alongside protobufs.
kzstd = { module = "org.meshtastic:kzstd", version.ref = "kzstd" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compat = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compat" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
