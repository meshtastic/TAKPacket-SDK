org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Dokka 2.x requires explicit opt-in to its V2 Gradle plugin mode.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# The shared `nativeMain` source set holds ONE ZstdCodec actual that references
# the `zstd` cinterop symbols for all nine native targets. cinterop
# commonization lets that shared (hierarchical) source set resolve the cinterop
# API at metadata-compile time instead of only at each leaf target.
kotlin.mpp.enableCInteropCommonization=true

# Publishing coordinates (picked up by com.vanniktech.maven.publish)
GROUP=org.meshtastic
POM_ARTIFACT_ID=takpacket-sdk
VERSION_NAME=0.5.3
