name: Bump version

# Stamps a new version into all five release-coupled sources via
# scripts/bump-version.sh, cuts the changelog, and opens a PR. Kept SEPARATE
# from release.yml so the bump is reviewable: merge this PR, then dispatch the
# Release workflow.
#
#   VERSION · kotlin/gradle.properties · python/pyproject.toml ·
#   typescript/package.json · csharp/.../Meshtastic.TAK.csproj

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, no leading v (e.g. 0.7.0)"
        required: true
        type: string

concurrency:
  group: bump-version-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: Stamp version & open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp all five version sources
        # The script validates the version and self-verifies with the same
        # extraction release.yml uses, so a failure here means a failure there.
        run: |
          chmod +x scripts/bump-version.sh
          scripts/bump-version.sh "${{ inputs.version }}"

      - name: Cut the changelog section
        # Moves `## [Unreleased]` under a dated `## [x.y.z]` heading and adds the
        # compare link, touching no other line. It runs in the same PR as the
        # version stamp because release.yml refuses a version with no section.
        env:
          V: ${{ inputs.version }}
        run: scripts/changelog.sh cut "${V#v}"

      - name: Commit to a release branch & open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          BRANCH="release/bump-${V}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION kotlin/gradle.properties python/pyproject.toml \
                  typescript/package.json csharp/src/Meshtastic.TAK/Meshtastic.TAK.csproj \
                  CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::notice::Repo is already at ${V}, nothing to bump."
            exit 0
          fi

          git commit -m "release: bump version to ${V}"
          # Force-push so re-running the workflow for the same version refreshes
          # the branch instead of erroring on a stale ref.
          git push --force origin "$BRANCH"

          BODY=$(cat <<EOF
          Automated version bump to **${V}** across all five release-coupled sources:

          - \`VERSION\`
          - \`kotlin/gradle.properties\` (\`VERSION_NAME\`)
          - \`python/pyproject.toml\`
          - \`typescript/package.json\`
          - \`csharp/src/Meshtastic.TAK/Meshtastic.TAK.csproj\`

          Plus \`CHANGELOG.md\`, whose \`## [Unreleased]\` entries \`scripts/changelog.sh cut\`
          moved into a \`## [${V}]\` section. **Read that diff**: it is the GitHub Release
          body, and the Release workflow refuses a version with no section.

          Generated by \`scripts/bump-version.sh\` via the **Bump version** workflow.

          **Next:** merge this PR, then dispatch the **Release** workflow with \`version=${V}\`.
          EOF
          )

          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "::notice::PR for ${BRANCH} already open, updated with the new commit."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "release: bump version to ${V}" \
              --body "$BODY"
          fi
