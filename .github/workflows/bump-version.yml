name: Bump version

# Stamps a new version into all five release-coupled sources via
# scripts/bump-version.sh and opens a PR. Kept SEPARATE from release.yml so the
# bump is reviewable: merge this PR, then dispatch the Release workflow.
#
#   VERSION · kotlin/gradle.properties · python/pyproject.toml ·
#   typescript/package.json · csharp/.../Meshtastic.TAK.csproj

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, no leading v (e.g. 0.7.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Stamp version & open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Submodules are pulled for the changelog step below: it configures the
        # Kotlin build, and configuring against a half-checked-out tree is not
        # worth debugging for the sake of a shallower clone.
        with:
          submodules: true

      - name: Setup JDK 17
        # Only so `patchChangelog` below can run. Nothing here compiles.
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Stamp all five version sources
        # The script validates the version and self-verifies with the same
        # extraction release.yml uses, so a failure here means a failure there.
        run: |
          chmod +x scripts/bump-version.sh
          scripts/bump-version.sh "${{ inputs.version }}"

      - name: Cut the changelog section
        # `patchChangelog` moves everything under `## [Unreleased]` into a dated
        # `## [x.y.z]` heading and adds the comparison links. It runs HERE, in the
        # same PR as the version stamp, because release.yml hard-fails on a version
        # with no changelog section — and because a changelog cut in a separate
        # commit is a changelog that stops being cut. It reads VERSION_NAME, which
        # the step above has already stamped.
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: ./kotlin/gradlew -p kotlin --console=plain -q patchChangelog

      - name: Commit to a release branch & open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          BRANCH="release/bump-${V}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add VERSION kotlin/gradle.properties python/pyproject.toml \
                  typescript/package.json csharp/src/Meshtastic.TAK/Meshtastic.TAK.csproj \
                  CHANGELOG.md

          if git diff --cached --quiet; then
            echo "::notice::Repo is already at ${V} — nothing to bump."
            exit 0
          fi

          git commit -m "release: bump version to ${V}"
          # Force-push so re-running the workflow for the same version refreshes
          # the branch instead of erroring on a stale ref.
          git push --force origin "$BRANCH"

          BODY=$(cat <<EOF
          Automated version bump to **${V}** across all five release-coupled sources:

          - \`VERSION\`
          - \`kotlin/gradle.properties\` (\`VERSION_NAME\`)
          - \`python/pyproject.toml\`
          - \`typescript/package.json\`
          - \`csharp/src/Meshtastic.TAK/Meshtastic.TAK.csproj\`

          Plus \`CHANGELOG.md\`, whose \`## [Unreleased]\` entries this workflow cut into a
          \`## [${V}]\` section with \`./kotlin/gradlew -p kotlin patchChangelog\`. **Read that diff** — it is
          what the GitHub Release body will say, and the Release workflow refuses to
          publish a version with no section.

          Generated by \`scripts/bump-version.sh\` via the **Bump version** workflow.

          **Next:** merge this PR, then dispatch the **Release** workflow.
          EOF
          )

          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "::notice::PR for ${BRANCH} already open — updated with the new commit."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "release: bump version to ${V}" \
              --body "$BODY"
          fi
