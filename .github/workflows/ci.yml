name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  kotlin:
    name: Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - name: Static analysis (Spotless + detekt)
        working-directory: kotlin
        # Spotless (ktlint via .editorconfig) enforces formatting; detekt runs the
        # default ruleset (legacy findings grandfathered in config/detekt/baseline.xml).
        run: ./gradlew spotlessCheck detekt --stacktrace
      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kotlin/gradle/libs.versions.toml', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Check public API (BCV — JVM + klib/native ABI)
        working-directory: kotlin
        # Validates api/takpacket-sdk.api (JVM) and api/takpacket-sdk.klib.api
        # (merged native/common surface). The Linux runner can't build the Apple
        # targets, so BCV skips them and trusts the committed dump; the full
        # 12-target klib dump is regenerated on macOS via `./gradlew apiDump`.
        run: ./gradlew apiCheck --stacktrace
      - name: Test (JVM + JS + Wasm/JS + Wasm/WASI + Linux native)
        working-directory: kotlin
        # KMP has no top-level `test` task — each target has its own `<target>Test`.
        # The common suites (RoundTrip/Resilience/Decode via InlinedFixtures) are
        # compiled per target but only execute when their task is invoked, so run
        # every target this Linux runner can build: jvmTest + jsTest + wasmJsTest
        # + wasmWasiTest + linuxX64Test. wasmWasi runs via the same nodejs()
        # runner as wasmJs (see kotlin { wasmWasi { nodejs() } }), so it needs no
        # extra CI setup. The Apple/native targets run on the macOS leg below.
        run: ./gradlew jvmTest jsTest wasmJsTest wasmWasiTest linuxX64Test --stacktrace
      - name: Coverage report (Kover XML)
        working-directory: kotlin
        run: ./gradlew koverXmlReport
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: kotlin/build/reports/kover/report.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-test-results
          path: kotlin/build/reports/tests/

  kotlin-native:
    name: Kotlin (Apple/native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kotlin/gradle/libs.versions.toml', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Test (Apple/native targets)
        working-directory: kotlin
        # The ubuntu Kotlin job can't build the Apple targets, so 12/13 targets
        # never ran their tests. Execute the Apple/native suites here — the same
        # common RoundTrip/Resilience/Decode suites (via InlinedFixtures), just on
        # macosArm64 + iosSimulatorArm64.
        run: ./gradlew macosArm64Test iosSimulatorArm64Test --stacktrace

  swift:
    name: Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Test
        working-directory: swift
        run: swift test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install deps
        run: pip install pytest protobuf zstandard
      - name: Test
        working-directory: python
        run: python -m pytest tests/ -v

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install deps
        working-directory: typescript
        run: rm -f package-lock.json && npm install
      - name: Test
        working-directory: typescript
        run: npx vitest run

  csharp:
    name: C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"
      - name: Test
        working-directory: csharp
        run: dotnet test --verbosity normal

  publish-snapshot:
    name: Publish Snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [kotlin, kotlin-native, swift, python, typescript, csharp]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - name: Compute snapshot version
        id: version
        run: |
          RELEASE_VERSION=$(grep '^VERSION_NAME=' kotlin/gradle.properties | cut -d= -f2)
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          SNAPSHOT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          echo "snapshot=$SNAPSHOT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish to Maven Central (snapshots)
        working-directory: kotlin
        run: >-
          ./gradlew publishAllPublicationsToMavenCentralRepository
          -PVERSION_NAME=${{ steps.version.outputs.snapshot }}
          --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
