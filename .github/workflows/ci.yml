name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_CACHE_URL: ${{ secrets.GRADLE_CACHE_URL }}
  GRADLE_CACHE_USERNAME: ${{ secrets.GRADLE_CACHE_USERNAME }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}

jobs:
  kotlin:
    name: Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kotlin/gradle/libs.versions.toml', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-
      - name: Check public API (BCV — JVM + klib/native ABI)
        working-directory: kotlin
        # Validates api/takpacket-sdk.api (JVM) and api/takpacket-sdk.klib.api
        # (merged native/common surface). The Linux runner can't build the Apple
        # targets, so BCV skips them and trusts the committed dump; the full
        # 13-target dump is regenerated on macOS via `./gradlew apiDump`.
        run: ./gradlew apiCheck --stacktrace
      - name: Test
        working-directory: kotlin
        # The Kotlin module is now a kotlin("multiplatform") project with a
        # jvm() target. The top-level `test` task no longer exists — use
        # `jvmTest` to run the JVM target's tests (equivalent to the old
        # kotlin("jvm") `test` task). iOS targets are compile-only for now.
        run: ./gradlew jvmTest --quiet
      - name: Coverage report (Kover XML)
        working-directory: kotlin
        run: ./gradlew koverXmlReport
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: kotlin/build/reports/kover/report.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-test-results
          path: kotlin/build/reports/tests/

  swift:
    name: Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Test
        working-directory: swift
        run: swift test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install deps
        run: pip install pytest protobuf zstandard
      - name: Test
        working-directory: python
        run: python -m pytest tests/ -v

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install deps
        working-directory: typescript
        run: rm -f package-lock.json && npm install
      - name: Test
        working-directory: typescript
        run: npx vitest run

  csharp:
    name: C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Test
        working-directory: csharp
        run: dotnet test --verbosity normal

  publish-snapshot:
    name: Publish Snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [kotlin, swift, python, typescript, csharp]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compute snapshot version
        id: version
        run: |
          RELEASE_VERSION=$(grep '^VERSION_NAME=' kotlin/gradle.properties | cut -d= -f2)
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          SNAPSHOT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          echo "snapshot=$SNAPSHOT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish to Maven Central (snapshots)
        working-directory: kotlin
        run: >-
          gradle publishAllPublicationsToMavenCentralRepository
          -PVERSION_NAME=${{ steps.version.outputs.snapshot }}
          --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
