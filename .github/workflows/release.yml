name: Release

# Dispatch from main with the version a merged bump-version PR set, or push its tag.
# Every gate runs before the tag is pushed, so a refused release leaves no tag behind.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.9.3 (must match VERSION)'
        required: true
        type: string
      dry_run:
        description: 'Run every gate and build every artifact, but tag, publish and release nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Gate, publish to Maven Central & release
    # macOS because `swift test` needs it. The green-CI gate can wait 45 minutes and the
    # consistency check polls Maven Central for 25, on top of five test suites and a
    # signed all-target publish.
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
      statuses: read
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          # A dispatch takes the bare version so the concurrency group above is canonical.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${REQUESTED#v}" != "$REQUESTED" ]; then
            echo "::error::pass the version without a leading v: ${REQUESTED#v}"
            exit 1
          fi
          echo "version=${REQUESTED#v}" >> "$GITHUB_OUTPUT"

      - name: Release from main only
        if: env.DRY_RUN != 'true'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF is not on main; release from main (dry_run may run anywhere)"
            exit 1
          fi

      - name: Verify the version sources agree
        # One version is stamped into five package coordinates by scripts/bump-version.sh,
        # and a mismatch would ship, say, a Kotlin 0.9.3 jar beside a TypeScript 0.9.2 tarball.
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          VERSION_FILE=$(tr -d '[:space:]' < VERSION)
          VERSION_GRADLE=$(grep -E "^VERSION_NAME=" kotlin/gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_PYTHON=$(grep -E '^version\s*=' python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_NPM=$(grep -E '^\s*"version"\s*:' typescript/package.json | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CSHARP=$(grep -oE '<Version>[^<]+</Version>' csharp/src/Meshtastic.TAK/Meshtastic.TAK.csproj | head -1 | sed -E 's|<Version>([^<]+)</Version>|\1|')

          echo "requested:                    $V"
          echo "VERSION:                      $VERSION_FILE"
          echo "kotlin/gradle.properties:     $VERSION_GRADLE"
          echo "python/pyproject.toml:        $VERSION_PYTHON"
          echo "typescript/package.json:      $VERSION_NPM"
          echo "csharp/Meshtastic.TAK.csproj: $VERSION_CSHARP"

          FAIL=0
          for SOURCE in "VERSION:$VERSION_FILE" \
                        "kotlin/gradle.properties:$VERSION_GRADLE" \
                        "python/pyproject.toml:$VERSION_PYTHON" \
                        "typescript/package.json:$VERSION_NPM" \
                        "csharp/Meshtastic.TAK.csproj:$VERSION_CSHARP"; do
            FILE="${SOURCE%%:*}"
            VER="${SOURCE##*:}"
            if [ "$VER" != "$V" ]; then
              echo "::error::releasing $V, but $FILE is '$VER'"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::run scripts/bump-version.sh $V (or the Bump version workflow) and merge it first"
            exit 1
          fi

          git fetch --quiet origin "refs/tags/v$V:refs/tags/v$V" 2>/dev/null || true
          if git rev-parse --quiet --verify "v$V^{commit}" >/dev/null &&
             [ "$(git rev-parse "v$V^{commit}")" != "$(git rev-parse HEAD)" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::v$V already exists on another commit; a real release would stop here"
            else
              echo "::error::v$V already exists on another commit"
              exit 1
            fi
          fi
          echo "releasing $V from $(git rev-parse --short HEAD)"

      - name: Render release notes
        # The CHANGELOG.md section is the Release body verbatim; changelog.sh fails on a
        # missing or empty section.
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(scripts/changelog.sh notes "$V")
          cat > release-notes.md <<EOF
          ## TAKPacket-SDK v${V}

          Cross-platform CoT XML to TAKPacketV2 conversion and zstd dictionary compression for Meshtastic.

          ### Artifacts

          | Platform | File | Usage |
          |----------|------|-------|
          | **Kotlin** | \`.jar\` | \`implementation("org.meshtastic:takpacket-sdk:${V}")\` via Maven Central |
          | **Swift** | \`.zip\` | Add via SPM: point to this repo tag \`v${V}\` |
          | **Python** | \`.whl\` | \`pip install meshtastic_tak-*.whl\` |
          | **TypeScript** | \`.tgz\` | \`npm install meshtastic-takpacket-sdk-*.tgz\` |
          | **C#** | \`.nupkg\` | \`dotnet add package Meshtastic.TAK\` (or install local nupkg) |

          ### Changes

          EOF
          printf '%s\n' "$NOTES" >> release-notes.md
          cat release-notes.md

      # CI does not run on tags, so the five suites the main ruleset requires are only
      # guaranteed by those checks having passed on this exact commit.
      - name: Require green CI on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-checks.sh green-ci "$(git rev-parse HEAD)"

      # ── Set up every runtime ────────────────────────────────────────────

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kotlin/gradle/libs.versions.toml', 'kotlin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install zstd (for Swift)
        run: brew install zstd

      - name: Install Python build tools
        run: pip install build pytest protobuf zstandard

      # ── Run all tests ───────────────────────────────────────────────────

      - name: Test Kotlin
        working-directory: kotlin
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: ./gradlew jvmTest --quiet

      - name: Test Swift
        working-directory: swift
        run: swift test

      - name: Test Python
        working-directory: python
        run: python -m pytest tests/ -q

      - name: Test TypeScript
        working-directory: typescript
        run: |
          rm -f package-lock.json && npm install
          npx vitest run

      - name: Test C#
        working-directory: csharp
        run: dotnet test --verbosity quiet

      # ── Stage and check the Maven artifacts ─────────────────────────────

      - name: Stage signed artifacts locally
        working-directory: kotlin
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace

      - name: Refuse a -SNAPSHOT dependency
        run: scripts/release-checks.sh no-snapshots "${{ steps.version.outputs.version }}"

      # ── Build the packages attached to the Release ──────────────────────

      - name: Build Kotlin JAR
        working-directory: kotlin
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: ./gradlew jvmJar --quiet

      - name: Build Python wheel
        working-directory: python
        run: python -m build

      - name: Build TypeScript tarball
        working-directory: typescript
        run: |
          npm run build
          npm pack

      - name: Build C# NuGet package
        working-directory: csharp
        run: dotnet pack src/Meshtastic.TAK -c Release --verbosity quiet

      - name: Build Swift source zip
        run: |
          zip -rq meshtastic-tak-swift-${{ steps.version.outputs.version }}.zip swift/ \
            -x "swift/.build/*" "swift/.swiftpm/*"

      - name: Collect release artifacts
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-artifacts

          # Kotlin JAR: the main artifact, not -sources or -javadoc
          cp "kotlin/build/libs/takpacket-sdk-jvm-${V}.jar" "release-artifacts/meshtastic-tak-${V}.jar"
          cp python/dist/*.whl python/dist/*.tar.gz release-artifacts/
          cp typescript/*.tgz release-artifacts/
          cp csharp/src/Meshtastic.TAK/bin/Release/*.nupkg release-artifacts/
          cp meshtastic-tak-swift-*.zip release-artifacts/

          ls -lh release-artifacts/

      - name: Collect every staged artifact for attestation
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p maven-attestation
          find ~/.m2/repository/org/meshtastic -path "*/$V/*" -type f \
            \( -name '*.jar' -o -name '*.klib' -o -name '*.pom' -o -name '*.module' \) \
            -exec cp {} maven-attestation/ \;
          ls -1 maven-attestation

      - name: Attest the staged and attached artifacts
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            maven-attestation/*
            release-artifacts/*

      - name: Check Maven Central state
        # Sonatype rejects a re-upload, so a re-run after a partial release skips the publish.
        id: central
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # Only a 404 means unpublished; anything else stops the release rather than guess.
          for _ in 1 2 3 4 5; do
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/org/meshtastic/takpacket-sdk-jvm/$V/takpacket-sdk-jvm-$V.pom" || echo 000)
            echo "Maven Central POM probe for $V: HTTP $HTTP"
            case "$HTTP" in
              200) echo "published=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              404) echo "published=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::Maven Central did not answer 200 or 404 for $V"
          exit 1

      # ── Tag, publish, release ───────────────────────────────────────────

      - name: Push the release tag
        # After every gate and the Central probe, so a refused release leaves no tag, and
        # before the publish, so SPM consumers resolve every version Central has.
        if: env.DRY_RUN != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --quiet --verify "v$V" >/dev/null; then
            echo "v$V already on origin"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"

      - name: Publish to Maven Central
        if: env.DRY_RUN != 'true' && steps.central.outputs.published != 'true'
        working-directory: kotlin
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Create or update the GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: release-artifacts/*

      # Both halves must be present: the tag for SPM consumers, the POM for Gradle ones.
      # A missing tag fails the job; a POM still missing after 25 minutes is Central
      # Portal to repo1.maven.org propagation, so it warns.
      - name: Verify release consistency
        if: env.DRY_RUN != 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin "refs/tags/v$V:refs/tags/v$V" 2>/dev/null || true
          if git rev-parse --quiet --verify "v$V" >/dev/null; then
            echo "ok   tag v$V on origin ($(git rev-parse "v$V^{commit}"))"
          else
            echo "::error::v$V is missing on origin, so SPM consumers cannot resolve this release"
            exit 1
          fi

          POM="https://repo1.maven.org/maven2/org/meshtastic/takpacket-sdk-jvm/$V/takpacket-sdk-jvm-$V.pom"
          HTTP=000
          for i in $(seq 1 25); do
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" "$POM")
            if [ "$HTTP" = 200 ]; then
              echo "ok   $POM (attempt $i)"
              break
            fi
            echo "wait $POM: HTTP $HTTP (attempt $i/25)"
            sleep 60
          done
          if [ "$HTTP" != 200 ]; then
            echo "::warning::$POM has not synced after 25 minutes. The publish step succeeded, so this is Central Portal propagation; confirm it resolves before downstream consumers bump."
          fi

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        run: echo "dry run passed every gate for ${{ steps.version.outputs.version }}; nothing was tagged, attested, published or released"
