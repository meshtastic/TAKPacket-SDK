# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
#
# Only the Kotlin binding reports coverage (Kover, JVM target). Kover
# instruments JVM bytecode; Native/JS/Wasm execution is not counted.
# Statuses are INFORMATIONAL (non-blocking) for now; a koverVerify gate
# can be added once a baseline is established.
coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags"
  require_changes: true

ignore:
  - "**/build/**"
  - "**/api/**"
  - "**/*Test*.kt"
  - "swift/**"
  - "python/**"
  - "typescript/**"
  - "csharp/**"
